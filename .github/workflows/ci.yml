name: CI

on:
  pull_request:
  push:
    branches:
      - migration
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:65321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:65322/postgres
      GEMINI_API_KEY: ""
      AI_SUMMARY_PROVIDER: fallback
      ALPHA_VANTAGE_API_KEY: ""
      FINNHUB_API_KEY: ""
      TWELVE_DATA_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage smoke
        run: npm run test -- --coverage.enabled=false

      - name: Build
        run: npm run build

      - name: Parity check
        run: npm run parity:check
